          <rect x="150" y="296" width="260" height="40" rx="8" class="fillA"/><text class="tw" x="280" y="321" text-anchor="middle">Orchestrator / Router LLM</text>
          <path d="M410 316H508" class="ln" marker-end="url(#ah)"/><text class="tl" x="424" y="308">Response</text>
          <circle cx="530" cy="316" r="16" class="box2"/><text class="tm" x="530" y="319" text-anchor="middle">···</text>
          <path d="M200 338V366M280 338V366M360 338V366" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
          <rect x="162" y="368" width="76" height="30" rx="6" class="fillD"/><text class="tws" x="200" y="387" text-anchor="middle">Specialist 1</text>
          <rect x="242" y="368" width="76" height="30" rx="6" class="fillD"/><text class="tws" x="280" y="387" text-anchor="middle">Specialist 2</text>
          <rect x="322" y="368" width="76" height="30" rx="6" class="fillD"/><text class="tws" x="360" y="387" text-anchor="middle">Specialist 3</text>
          <path d="M200 398V428H244M280 398V414M360 398V428H316" class="ln dash" marker-end="url(#ah)"/>
          <rect x="246" y="416" width="68" height="26" rx="6" class="box"/><text class="tl" x="280" y="433" text-anchor="middle">Tools</text>
