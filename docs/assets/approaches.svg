          <path d="M410 62H508" class="ln" marker-end="url(#ah)"/><text class="tl" x="424" y="54">Response</text>
          <circle cx="530" cy="62" r="16" class="box2"/><text class="tm" x="530" y="65" text-anchor="middle">···</text>
          <text class="tl" x="280" y="102" text-anchor="middle">Single model trained for general purpose use</text>
          <!-- row 2 -->
          <text class="t" x="10" y="146">2. Fine-tuned LLM</text>
          <circle cx="28" cy="188" r="16" class="box2"/><circle cx="28" cy="183" r="4" class="ahA"/><path d="M20 196q8-9 16 0" class="lnA"/>
          <path d="M48 188H146" class="ln" marker-end="url(#ah)"/><text class="tl" x="72" y="180">Query</text>
          <rect x="150" y="166" width="260" height="22" rx="6" class="fillD"/><text class="tws" x="280" y="181" text-anchor="middle">Base LLM</text>
          <rect x="150" y="190" width="260" height="22" rx="6" class="fillA"/><text class="tws" x="280" y="205" text-anchor="middle">Fine-tuning layer</text>
          <path d="M410 188H508" class="ln" marker-end="url(#ah)"/><text class="tl" x="424" y="180">Response</text>
          <circle cx="530" cy="188" r="16" class="box2"/><text class="tm" x="530" y="191" text-anchor="middle">···</text>
          <text class="tl" x="280" y="232" text-anchor="middle">Base model with additional domain-specific training</text>
          <!-- row 3 -->
          <text class="t" x="10" y="276">3. Agentic system</text>
          <circle cx="28" cy="316" r="16" class="box2"/><circle cx="28" cy="311" r="4" class="ahA"/><path d="M20 324q8-9 16 0" class="lnA"/>
