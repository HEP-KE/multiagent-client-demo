/* "Fog and brass" tokens, shared with hep-genesis-releases. */
:root {

* { box-sizing: border-box; margin: 0; }
html { scroll-padding-top: calc(var(--top) + 16px); }

/* ---------------------------------------------------------------- page headers */

h1 { font-family: var(--font-serif); font-weight: 500; font-size: clamp(36px, 5.4vw, 58px); line-height: 1.06; letter-spacing: -.012em; margin: 20px 0 18px; max-width: 18em; }
h1 em, h2 em { font-style: italic; color: var(--accent-text); }
h2 { font-family: var(--font-serif); font-weight: 500; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; letter-spacing: -.01em; margin: 10px 0 14px; }
.head { margin-bottom: 32px; }
.sub { color: var(--text-dim); max-width: 66ch; font-size: 16.5px; }
.lede { font-size: 18px; color: var(--text-dim); max-width: 60ch; }

.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.divider h2 { font-size: clamp(30px, 4vw, 44px); }
.divider .sub { margin: 0 auto; }
.divider .pager { text-align: left; }

/* ---------------------------------------------------------------- markdown body */
.body :is(p, ul, ol, .code, figure, .grid, .split, .note, .warn, .query, .actions, .steps, table) { margin-top: 14px; }
.body :is(p, ul, ol, .code, figure, .grid, .split, .note, .warn, .query, .actions, .steps, table, h3, h4, h6):first-child { margin-top: 0; }
.body p { color: var(--text-dim); max-width: 72ch; }
.body strong { color: var(--text); font-weight: 600; }
.body h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -.003em; margin: 26px 0 6px; color: var(--text); }
.body h4 { font-family: var(--font-mono); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); font-weight: 500; margin: 26px 0 10px; }
.body h6 { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); font-weight: 400; margin: 0 0 8px; }
.body ul { list-style: none; padding: 0; display: grid; gap: 9px; }
.body ul li { position: relative; padding-left: 18px; color: var(--text-dim); font-size: 15px; }
.body ul li::before { content: ''; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .75; }
.body ul ul { margin-top: 8px; }
.body ol { padding-left: 22px; color: var(--text-dim); }

.body blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--text-dim); margin-top: 14px; }
.body table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--bg1); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.body th, .body td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); color: var(--text-dim); vertical-align: top; }
.body th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); font-weight: 500; background: var(--bg2); }

/* containers */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.split.right { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
.split.center { align-items: center; }
@media (max-width: 1100px) { .split, .split.even, .split.right { grid-template-columns: 1fr; } }
.grid > *, .split > * { min-width: 0; }
.card { background: var(--bg1); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card p, .card li { font-size: 14.5px; }
.card h3 { font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin-top: 0; }
.card h3 a { color: var(--accent-text); }
.card h6 + h3 a { color: var(--text); }
.note, .warn { display: flex; gap: 14px; align-items: flex-start; background: var(--paper); border: 1px solid var(--line-soft); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 14px 18px; font-size: 14.5px; }
.warn { border-left-color: var(--warn); }
.note > .ico, .warn > .ico { width: 18px; height: 18px; flex-shrink: 0; margin-top: 3px; color: var(--accent-text); }
.warn > .ico { color: var(--warn); }
.note > div, .warn > div { min-width: 0; flex: 1; }

.btn { display: inline-flex; align-items: center; gap: 10px; font: inherit; font-size: 15px; font-weight: 500; padding: 11px 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg2); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s; }
.btn:hover { text-decoration: none; background: var(--paper); border-color: var(--text-faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 6px 18px rgba(169,107,14,.22); }
.btn.primary:hover { background: #955e0b; border-color: #955e0b; }
.keys { font-size: 13px !important; color: var(--text-faint) !important; margin-top: 18px !important; }
kbd { font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--bg2); border-radius: 4px; padding: 0 5px; color: var(--text-dim); }

.query h6 { color: var(--accent-text); font-size: 12px; margin-bottom: 10px; }
.query .code { background: none; color: var(--text); box-shadow: none; margin-top: 0; }
.query .code pre { padding: 0; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
.query .copy { display: none; }

/* steps: every ### inside ::: steps becomes a numbered step */
.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line-soft); }
.step:first-child { padding-top: 0; }
.step:last-child { border-bottom: 0; }

.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }
.copy { position: absolute; top: 6px; right: 8px; font: 500 11px var(--font-ui); color: #bdb9ae; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 5px; padding: 3px 8px; cursor: pointer; opacity: 0; transition: opacity .15s; }
.code:hover .copy, .copy:focus-visible { opacity: 1; }
@media (hover: none) { .copy { opacity: 1; } }

/* figures */
figure.fig .frame { background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); overflow-x: auto; }

/* ---------------------------------------------------------------- pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line-soft); }
.pager a { display: block; border: 1px solid var(--line-soft); background: var(--bg1); border-radius: var(--radius); padding: 14px 18px; color: var(--text); transition: border-color .15s, background .15s; }

.pager .lbl { display: block; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); letter-spacing: .04em; margin-bottom: 2px; }
.pager .nx { text-align: right; grid-column: 2; }
.pager .ttl { font-weight: 500; }

@media (max-width: 900px) {

  <button class="icon-btn" id="nav-toggle" type="button" aria-expanded="false" aria-controls="side">Contents</button>
  <a class="brand" href="#cover"><svg><use href="#logo"/></svg><span class="brand-t">Building Scientific Agents</span><span class="sep">/</span><span class="sub-b">tutorial</span></a>
  <div class="top-right">
    <span class="counter" id="counter"></span>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="v-paged" aria-pressed="true">Pages</button>
      <button type="button" id="v-all" aria-pressed="false">Scroll</button>
    </div>
    <a class="gh" href="https://github.com/HEP-KE/multiagent-client-demo" aria-label="GitHub repository"><svg><use href="#i-gh"/></svg></a>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="layout">
  <nav class="side" id="side" aria-label="Pages"></nav>
  <main id="main"><div class="loading">Loading slides.md …</div></main>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script>
(function () {
  var SOURCE = 'slides.md';
  var main = document.getElementById('main');

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function inline(s) { return s ? marked.parseInline(s) : ''; }

  // ------------------------------------------------------------ code blocks
  // ```lang title="file/name.py" link="https://..."
  // ```console blocks: lines starting with "$ " get a prompt (not copied).
  function hl(code, lang) {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
    return esc(code);
  }
  marked.use({
    renderer: {
      code: function (code, info) {
        if (typeof code === 'object') { info = code.lang; code = code.text; }
        info = info || '';
        var lang = (info.match(/^\S+/) || [''])[0];
        var attrs = {}; info.replace(/(\w+)="([^"]*)"/g, function (_, k, v) { attrs[k] = v; });
        var body;
        if (lang === 'console' || lang === 'shell-session') {
          body = code.split('\n').map(function (l) {
            if (/^\$ /.test(l)) return '<span class="p">$ </span>' + hl(l.slice(2), 'bash');
            if (/^\s*#/.test(l)) return '<span class="hljs-comment">' + esc(l) + '</span>';
            return esc(l);
          }).join('\n');
        } else if (lang === 'text' || lang === '') {
          body = esc(code);
        } else {
          body = hl(code, lang === 'toml' ? 'ini' : lang);
        }
        var head = '';
        if (attrs.title) {
          var t = attrs.link ? '<a href="' + esc(attrs.link) + '">' + esc(attrs.title) + '</a>' : esc(attrs.title);
          head = '<div class="fn"><span class="dotc"></span>' + t + '</div>';
        }
        return '<div class="code">' + head + '<button class="copy" type="button">Copy</button><pre><code class="hljs">' + body + '</code></pre></div>';
      }
    }
  });

  // ------------------------------------------------------------ ::: containers
  // Builds a tree from "::: class names" ... ":::" lines, ignoring fenced code.
  function parseTree(text) {
    var root = { cls: '', items: [] }, stack = [root], fence = null;
    text.split('\n').forEach(function (line) {
      var top = stack[stack.length - 1];
      var f = line.match(/^\s*(```+|~~~+)/);
      if (f) { if (!fence) fence = f[1]; else if (line.trim().indexOf(fence) === 0) fence = null; top.items.push(line); return; }
      if (!fence) {
        var open = line.match(/^:::\s*([\w-][\w\s-]*)$/);
        if (open) { var n = { cls: open[1].trim(), items: [] }; top.items.push(n); stack.push(n); return; }
        if (/^:::\s*$/.test(line) && stack.length > 1) { stack.pop(); return; }
      }
      top.items.push(line);
    });
    return root;
  }
  function renderItems(items) {
    var out = '', buf = [];
    function flush() { if (buf.length) { out += marked.parse(buf.join('\n')); buf = []; } }
    items.forEach(function (it) { if (typeof it === 'string') buf.push(it); else { flush(); out += renderNode(it); } });
    flush();
    return out;
  }
  function renderNode(n) {
    var first = n.cls.split(/\s+/)[0];
    if (first === 'split') {
      var cols = [[]];
      n.items.forEach(function (it) { if (typeof it === 'string' && it.trim() === '|||') cols.push([]); else cols[cols.length - 1].push(it); });
      return '<div class="' + esc(n.cls) + '">' + cols.map(function (c) { return '<div class="col">' + renderItems(c) + '</div>'; }).join('') + '</div>';
    }
    return '<div class="' + esc(n.cls) + '">' + renderItems(n.items) + '</div>';
  }

  // ------------------------------------------------------------ pages
  function parseSlides(src) {
    src = src.replace(/^\s*<!--[\s\S]*?-->/, '');        // leading how-to comment
    var parts = src.split(/^\+\+\+[ \t]*$/m), slides = [];
    for (var i = 1; i + 1 < parts.length; i += 2) {
      var meta = {};
      parts[i].split('\n').forEach(function (l) { var m = l.match(/^\s*([\w-]+)\s*:\s*(.*)$/); if (m) meta[m[1]] = m[2].trim(); });
      if (meta.hidden === 'true' || meta.hidden === 'yes') continue;
      slides.push({ meta: meta, body: parts[i + 1] });
    }
    return slides;
  }
  function plain(s) { var d = document.createElement('div'); d.innerHTML = inline(s); return d.textContent; }

  function buildPage(s, i) {
    var m = s.meta, sec = document.createElement('section');
    sec.className = 'page' + (m.layout ? ' ' + m.layout : '');
    sec.id = m.id || ('page-' + (i + 1));
    sec.setAttribute('data-title', m.nav || plain(m.title || ('Page ' + (i + 1))));
    sec.setAttribute('data-group', m.group || '');
    var head = '';
    if (m.layout === 'cover') {
      head = (m.eyebrow ? '<span class="eyebrow"><span class="dot"></span>' + inline(m.eyebrow) + '</span>' : '') +
        '<h1>' + inline(m.title) + '</h1>' +
        (m.lede ? '<p class="lede">' + inline(m.lede) + '</p>' : '') +
        (m.byline ? '<p class="byline">' + inline(m.byline) + '</p>' : '');
    } else {
      head = '<div class="head">' + (m.kicker ? '<div class="kicker">' + inline(m.kicker) + '</div>' : '') +
        '<h2>' + inline(m.title) + '</h2>' + (m.sub ? '<p class="sub">' + inline(m.sub) + '</p>' : '') + '</div>';
    }
    sec.innerHTML = head + '<div class="body">' + renderItems(parseTree(s.body).items) + '</div>';
    enhance(sec);
    return sec;
  }

  // Turn rendered markdown into the styled components.
  function enhance(sec) {
    // An image alone in a paragraph becomes a figure; its "title" becomes the caption; .svg files are inlined.
    sec.querySelectorAll('.body p > img:only-child').forEach(function (img) {
      var p = img.parentNode; if (p.textContent.trim()) return;
      var fig = document.createElement('figure'); fig.className = 'fig';
      var frame = document.createElement('div'); frame.className = 'frame'; fig.appendChild(frame);
      var cap = img.getAttribute('title');
      if (cap) { var fc = document.createElement('figcaption'); fc.innerHTML = inline(cap); fig.appendChild(fc); img.removeAttribute('title'); }
      var src = img.getAttribute('src');
      if (/\.svg$/i.test(src)) {
        var alt = img.getAttribute('alt') || '';
        fetch(src).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
          frame.innerHTML = t; var svg = frame.querySelector('svg');
          if (svg) { svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', alt); }
        }).catch(function () { frame.appendChild(img); });
      } else {
        img.classList.add('zoom'); frame.appendChild(img);
        var wide = function () { if (img.naturalWidth / img.naturalHeight > 3) fig.classList.add('wide'); };
        if (img.complete) wide(); else img.addEventListener('load', wide);
      }
      p.replaceWith(fig);
    });
    // ::: steps: each ### starts a numbered step.
    sec.querySelectorAll('.steps').forEach(function (box) {
      var kids = Array.prototype.slice.call(box.childNodes), cur = null, n = 0;
      kids.forEach(function (k) {
        if (k.nodeType === 1 && k.tagName === 'H3') {
          n++; cur = document.createElement('div'); cur.className = 'step';
          cur.innerHTML = '<div class="num">' + n + '</div><div></div>';
          box.insertBefore(cur, k);
        }
        if (cur) cur.lastChild.appendChild(k);
      });
    });
    // ::: note / ::: warn: add an icon.
    sec.querySelectorAll('.note, .warn').forEach(function (b) {
      var wrap = document.createElement('div'); while (b.firstChild) wrap.appendChild(b.firstChild);
      b.innerHTML = '<svg class="ico"><use href="#i-' + (b.classList.contains('warn') ? 'warn' : 'info') + '"/></svg>'; b.appendChild(wrap);
    });
    // ::: actions: links become buttons, the first one primary.
    sec.querySelectorAll('.actions a').forEach(function (a, j) { a.className = 'btn' + (j === 0 ? ' primary' : ''); });
  }

  // ------------------------------------------------------------ navigation
  function start(pages) {
    var body = document.body, side = document.getElementById('side');
    var counter = document.getElementById('counter'), progress = document.getElementById('progress');
    var links = [], cur = 0;
    function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

    var lastGroup = null;
    pages.forEach(function (p, i) {
      var g = p.getAttribute('data-group');
      if (g && g !== lastGroup) { var h = document.createElement('div'); h.className = 'grp'; h.textContent = g; side.appendChild(h); }
      lastGroup = g;
      var a = document.createElement('a'); a.href = '#' + p.id;
      a.innerHTML = '<span class="n">' + String(i + 1).padStart(2, '0') + '</span><span></span>';
      a.lastChild.textContent = p.getAttribute('data-title');
      side.appendChild(a); links.push(a);
    });
    pages.forEach(function (p, i) {
      var nav = document.createElement('nav'); nav.className = 'pager'; nav.setAttribute('aria-label', 'Page navigation');
      function card(j, cls, lbl) {
        var a = document.createElement('a'); a.href = '#' + pages[j].id; a.className = cls;
        a.innerHTML = '<span class="lbl"></span><span class="ttl"></span>';
        a.firstChild.textContent = lbl; a.lastChild.textContent = pages[j].getAttribute('data-title');
        return a;
      }
      if (i > 0) nav.appendChild(card(i - 1, 'pv', '← Previous'));
      if (i < pages.length - 1) nav.appendChild(card(i + 1, 'nx', 'Next →'));
      p.appendChild(nav);
    });

    function isPaged() { return body.classList.contains('paged'); }
    function mark(i) {
      cur = i;
      links.forEach(function (a, j) { a.setAttribute('aria-current', j === i ? 'true' : 'false'); });
      counter.textContent = (i + 1) + ' / ' + pages.length;
      progress.style.width = ((i + 1) / pages.length * 100) + '%';
      if (isPaged() && links[i].scrollIntoView) links[i].scrollIntoView({ block: 'nearest' });
    }
    function show(i, fromHash) {
      i = Math.max(0, Math.min(pages.length - 1, i));
      if (isPaged()) { pages.forEach(function (p, j) { p.classList.toggle('on', j === i); }); window.scrollTo(0, 0); }
      else pages[i].scrollIntoView();
      mark(i);
      if (!fromHash && location.hash !== '#' + pages[i].id) history.replaceState(null, '', '#' + pages[i].id);
      body.classList.remove('nav-open');
    }
    function indexFromHash() {
      var id = decodeURIComponent(location.hash.slice(1));
      for (var i = 0; i < pages.length; i++) if (pages[i].id === id) return i;
      return 0;
    }
    function go(i) { history.pushState(null, '', '#' + pages[i].id); show(i, true); }

    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      var id = a.getAttribute('href').slice(1);
      var idx = pages.findIndex(function (p) { return p.id === id; });
      if (idx < 0) return;
      e.preventDefault(); go(idx);
    });
    window.addEventListener('popstate', function () { show(indexFromHash(), true); });
    window.addEventListener('hashchange', function () { show(indexFromHash(), true); });
    document.addEventListener('keydown', function (e) {
      if (!isPaged() || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.lightbox')) return;
      var t = e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); if (cur < pages.length - 1) go(cur + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (cur > 0) go(cur - 1); }
    });

    var bP = document.getElementById('v-paged'), bA = document.getElementById('v-all'), io = null;
    function setMode(m) {
      body.classList.toggle('paged', m === 'paged'); body.classList.toggle('all', m === 'all');
      bP.setAttribute('aria-pressed', m === 'paged'); bA.setAttribute('aria-pressed', m === 'all');
      store('sa-view', m);
      if (io) { io.disconnect(); io = null; }
      if (m === 'all' && 'IntersectionObserver' in window) {
        io = new IntersectionObserver(function (es) {
          es.forEach(function (en) { if (en.isIntersecting) { var i = pages.indexOf(en.target); mark(i); history.replaceState(null, '', '#' + pages[i].id); } });
        }, { rootMargin: '-45% 0px -50% 0px' });
        pages.forEach(function (p) { io.observe(p); });
      }
      show(cur, true);
    }
    bP.addEventListener('click', function () { setMode('paged'); });
    bA.addEventListener('click', function () { setMode('all'); });

    var nt = document.getElementById('nav-toggle');
    nt.addEventListener('click', function () { var o = body.classList.toggle('nav-open'); nt.setAttribute('aria-expanded', o); });

    document.querySelectorAll('.copy').forEach(function (b) {
      b.addEventListener('click', function () {
        var pre = b.parentNode.querySelector('pre').cloneNode(true);
        pre.querySelectorAll('.p').forEach(function (p) { p.remove(); });
        var shell = !!b.parentNode.querySelector('.p'), txt = pre.textContent;
        if (shell) txt = txt.split('\n').filter(function (l) { return l.trim().charAt(0) !== '#'; }).join('\n');
        var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); };
        try { navigator.clipboard.writeText(txt).then(done, function () {}); } catch (e) {}
      });
    });

    document.addEventListener('click', function (e) {
      var img = e.target.closest && e.target.closest('img.zoom'); if (!img) return;
      var lb = document.createElement('div'); lb.className = 'lightbox';
      var c = img.cloneNode(); c.className = ''; lb.appendChild(c);
      if (img.naturalWidth < 1600) c.style.width = 'min(' + img.naturalWidth + 'px, 94vw)';
      function close() { lb.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(ev) { if (ev.key === 'Escape') close(); }
      lb.addEventListener('click', close); document.addEventListener('keydown', onKey);
      body.appendChild(lb);
    });

    cur = indexFromHash();
    setMode(store('sa-view') === 'all' ? 'all' : 'paged');
  }

  fetch(SOURCE, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (src) {
      var pages = parseSlides(src).map(buildPage);
      main.innerHTML = '';
      pages.forEach(function (p) { main.appendChild(p); });
      start(pages);
    })
    .catch(function (err) {
      main.innerHTML = '<div class="loading">Could not load ' + SOURCE + ' (' + esc(err.message) + ').<br>' +
        'Opening index.html straight from disk does not work. Serve the folder instead:' +
        '<pre>python -m http.server 8000 -d docs\n# then open http://localhost:8000</pre></div>';
    });
})();
</script>
</body>
</html>
